name: Deployed tab lifecycle

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: tab-lifecycle-${{ github.event.deployment.id }}
  cancel-in-progress: false

jobs:
  tab-lifecycle:
    if: github.event.deployment_status.state == 'success' && github.event.sender.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Match the database and Clerk keys to the deployed environment.
    environment: ${{ github.event.deployment.production_environment && 'e2e-production' || 'e2e-preview' }}
    env:
      CI: "true"
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Check E2E configuration
        id: e2e-config
        shell: bash
        run: |
          missing=()
          for name in E2E_BASE_URL DATABASE_URL CLERK_SECRET_KEY NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY E2E_CLERK_USER_EMAIL; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping tab lifecycle E2E because required configuration is missing: ${missing[*]}. See docs/deployment-e2e.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.e2e-config.outputs.configured == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.e2e-config.outputs.configured == 'true'
      - name: Verify tab creation and deletion against the deployment
        if: steps.e2e-config.outputs.configured == 'true'
        run: npm run test:e2e
